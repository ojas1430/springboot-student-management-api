<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head}"></th:block><title>Enrollments</title></head>
<body><div class="d-flex" id="wrapper"><div th:replace="~{fragments/layout :: sidebar}"></div><div id="page-content-wrapper"><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">ACADEMICS</p><h2 class="mb-0">Course Enrollments</h2></div><a th:href="@{/enrollments/new}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Enroll Student</a></div>
<div th:if="${message}" class="alert alert-success" th:text="${message}"></div><section class="card"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Student</th><th>Course</th><th>Enrolled on</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="enrollment : ${enrollments.content}"><td data-label="Student" th:text="${enrollment.studentName}"></td><td data-label="Course"><span th:text="${enrollment.courseName}"></span><small class="d-block text-muted" th:text="${enrollment.courseCode}"></small></td><td data-label="Enrolled on" th:text="${enrollment.enrolledOn}"></td><td data-label="Status"><span class="badge rounded-pill" th:classappend="${enrollment.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${enrollment.active} ? 'Active' : 'Inactive'"></span></td><td data-label="Actions"><a th:href="@{/enrollments/{id}(id=${enrollment.id})}" class="btn btn-sm btn-soft me-1" aria-label="View enrollment"><i class="bi bi-eye"></i></a><a th:href="@{/enrollments/{id}/edit(id=${enrollment.id})}" class="btn btn-sm btn-soft" aria-label="Edit enrollment"><i class="bi bi-pencil"></i></a></td></tr><tr th:if="${enrollments.empty}"><td colspan="5" class="text-center text-muted py-5">No course enrollments yet.</td></tr></tbody></table></div></div></section>
<nav th:if="${enrollments.totalPages > 1}" class="mt-4"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${enrollments.first} ? 'disabled'"><a class="page-link" th:href="@{/enrollments(page=${enrollments.first ? 0 : enrollments.number - 1},size=${enrollments.size})}">Previous</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, enrollments.totalPages - 1)}" th:classappend="${n == enrollments.number} ? 'active'"><a class="page-link" th:href="@{/enrollments(page=${n},size=${enrollments.size})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${enrollments.last} ? 'disabled'"><a class="page-link" th:href="@{/enrollments(page=${enrollments.last ? enrollments.number : enrollments.number + 1},size=${enrollments.size})}">Next</a></li></ul></nav></main></div></div><div th:replace="~{fragments/layout :: scripts}"></div></body>
</html>
