<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head}"></th:block><title th:text="${enrollmentDTO.id == null ? 'Enroll Student' : 'Edit Enrollment'}">Enrollment</title></head>
<body><div class="d-flex" id="wrapper"><div th:replace="~{fragments/layout :: sidebar}"></div><div id="page-content-wrapper"><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">ACADEMICS</p><h2 class="mb-0" th:text="${enrollmentDTO.id == null ? 'Enroll a student' : 'Edit enrollment'}"></h2></div><a th:href="@{/enrollments}" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Back to enrollments</a></div>
<section class="card form-card"><div class="card-body"><form th:object="${enrollmentDTO}" th:action="${enrollmentDTO.id == null} ? @{/enrollments} : @{/enrollments/{id}(id=${enrollmentDTO.id})}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:errors="*{global}"></div><div class="row g-4"><div class="col-md-6"><label class="form-label" for="studentId">Student</label><select id="studentId" class="form-select" th:field="*{studentId}" th:errorclass="is-invalid"><option value="">Choose a student</option><option th:each="student : ${students}" th:value="${student.id}" th:text="${student.firstName + ' ' + student.lastName + ' · ' + student.email}"></option></select><div class="invalid-feedback" th:errors="*{studentId}"></div></div><div class="col-md-6"><label class="form-label" for="courseId">Course</label><select id="courseId" class="form-select" th:field="*{courseId}" th:errorclass="is-invalid"><option value="">Choose a course</option><option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseName + ' · ' + course.courseCode}"></option></select><div class="invalid-feedback" th:errors="*{courseId}"></div></div><div class="col-md-6"><label class="form-label" for="enrolledOn">Enrollment date</label><input id="enrolledOn" type="date" class="form-control" th:field="*{enrolledOn}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{enrolledOn}"></div></div><div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label" for="active">Enrollment is active</label></div></div></div><div class="d-flex justify-content-end gap-2 mt-5"><a th:href="@{/enrollments}" class="btn btn-soft">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i><span th:text="${enrollmentDTO.id == null ? 'Create enrollment' : 'Save changes'}"></span></button></div></form></div></section></main></div></div><div th:replace="~{fragments/layout :: scripts}"></div></body>
</html>
