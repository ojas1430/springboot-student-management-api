<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- Sidebar Fragment -->
<div th:fragment="sidebar" id="sidebar-wrapper">

    <div class="sidebar-heading border-bottom border-secondary p-3">
        <i class="bi bi-mortarboard-fill me-2"></i>
        SMS Admin
    </div>

    <div class="list-group list-group-flush">

        <a th:href="@{/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2 me-2"></i>
            Dashboard
        </a>

        <a th:href="@{/course/list}" class="sidebar-link">
            <i class="bi bi-book me-2"></i>
            Courses
        </a>

        <a th:href="@{/course/new}" class="sidebar-link">
            <i class="bi bi-plus-circle me-2"></i>
            Add Course
        </a>

        <a th:href="@{/students/list}" class="sidebar-link">
            <i class="bi bi-people me-2"></i>
            Students
        </a>

        <a th:href="@{/enrollments}" class="sidebar-link">
            <i class="bi bi-check2-square me-2"></i>
            Enrollments
        </a>

        <a th:href="@{/logout}"
           class="sidebar-link mt-auto border-top border-secondary">
            <i class="bi bi-box-arrow-right me-2"></i>
            Logout
        </a>

    </div>
</div>

<!-- Navbar Fragment -->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-light bg-light border-bottom">

    <div class="container-fluid">

        <button class="btn btn-outline-secondary"
                id="sidebarToggle"
                type="button">
            <i class="bi bi-list"></i>
        </button>

        <div class="ms-auto">
            <div class="dropdown">

                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="navbarDropdown"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false">

                    <i class="bi bi-person-circle me-1"></i>
                    Admin User
                </a>

                <ul class="dropdown-menu dropdown-menu-end"
                    aria-labelledby="navbarDropdown">

                    <li>
                        <a class="dropdown-item" href="#">
                            Profile
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="#">
                            Settings
                        </a>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a class="dropdown-item" th:href="@{/logout}">
                            Logout
                        </a>
                    </li>

                </ul>
            </div>
        </div>

    </div>
</nav>

<!-- Footer Fragment -->
<footer th:fragment="footer"
        class="py-4 bg-light mt-auto border-top">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center justify-content-between small">

            <div class="text-muted">
                Copyright &copy; Student Management System 2023
            </div>

            <div>
                <a href="#">Privacy Policy</a>
                &middot;
                <a href="#">Terms &amp; Conditions</a>
            </div>

        </div>

    </div>
</footer>

<!-- Scripts Fragment -->
<th:block th:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const sidebarToggle = document.getElementById('sidebarToggle');

            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', function () {
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }

        });
    </script>

</th:block>

</body>
</html>
