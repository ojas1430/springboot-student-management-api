<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Edit Student - Student Management System</title>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>
        <main class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4"><h2>Edit Student</h2><a th:href="@{/students/list}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Back to List</a></div>
            <div class="card mb-4"><div class="card-header bg-white"><i class="bi bi-pencil-square me-1"></i>Student Details</div><div class="card-body">
                <form th:action="@{/students/{id}/update(id=${studentDTO.id})}" th:object="${studentDTO}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6"><label for="firstName" class="form-label">First Name</label><input id="firstName" type="text" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid" required><div class="invalid-feedback" th:errors="*{firstName}"></div></div>
                        <div class="col-md-6"><label for="lastName" class="form-label">Last Name</label><input id="lastName" type="text" th:field="*{lastName}" class="form-control" th:errorclass="is-invalid" required><div class="invalid-feedback" th:errors="*{lastName}"></div></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label for="email" class="form-label">Email Address</label><input id="email" type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required><div class="invalid-feedback" th:errors="*{email}"></div></div>
                        <div class="col-md-6"><label for="phoneNumber" class="form-label">Phone Number</label><input id="phoneNumber" type="tel" th:field="*{phoneNumber}" class="form-control"></div>
                    </div>
                    <div class="mb-3"><label for="address" class="form-label">Address</label><textarea id="address" th:field="*{address}" class="form-control" th:errorclass="is-invalid" rows="3"></textarea><div class="invalid-feedback" th:errors="*{address}"></div></div>
                    <div class="form-check mb-3"><input id="active" type="checkbox" th:field="*{active}" class="form-check-input"><label for="active" class="form-check-label">Active</label></div>
                    <div class="d-flex justify-content-end"><a th:href="@{/students/list}" class="btn btn-light me-2">Cancel</a><button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Update Student</button></div>
                </form>
            </div></div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
