<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title>Students - Student Management System</title>
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>
        <main class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Students</h2>
                <a th:href="@{/students/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add New Student</a>
            </div>
            <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
            <div class="card mb-4">
                <div class="card-header bg-white"><i class="bi bi-table me-1"></i>Student List</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle">
                            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
                            <tbody>
                            <tr th:each="student : ${students.content}">
                                <td th:text="${student.id}"></td>
                                <td th:text="${student.firstName + ' ' + student.lastName}"></td>
                                <td th:text="${student.email}"></td>
                                <td th:text="${student.phoneNumber}"></td>
                                <td>
                                    <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-info text-white me-1" title="View" aria-label="View student"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-sm btn-warning text-white" title="Edit" aria-label="Edit student"><i class="bi bi-pencil"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${students.empty}"><td colspan="5" class="text-center text-muted">No students have been added yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <nav th:if="${students.totalPages > 1}" aria-label="Student pagination">
                        <ul class="pagination justify-content-end mb-0">
                            <li class="page-item" th:classappend="${students.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/students/list(page=${students.first ? 0 : students.number - 1},size=${students.size})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, students.totalPages - 1)}" th:classappend="${pageNum == students.number} ? 'active'">
                                <a class="page-link" th:href="@{/students/list(page=${pageNum},size=${students.size})}" th:text="${pageNum + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${students.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/students/list(page=${students.last ? students.number : students.number + 1},size=${students.size})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
