<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/layout :: head}"></th:block><title>Enrollment Details</title></head><body><div class="d-flex" id="wrapper"><div th:replace="~{fragments/layout :: sidebar}"></div><div id="page-content-wrapper"><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">ENROLLMENT</p><h2 class="mb-0">Enrollment Details</h2></div><a th:href="@{/enrollments}" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Back to enrollments</a></div><section class="card detail-card"><div class="card-body"><div class="detail-row"><span>Student</span><strong th:text="${enrollment.studentName}"></strong></div><div class="detail-row"><span>Course</span><strong th:text="${enrollment.courseName + ' (' + enrollment.courseCode + ')'}"></strong></div><div class="detail-row"><span>Enrolled on</span><strong th:text="${enrollment.enrolledOn}"></strong></div><div class="detail-row"><span>Status</span><strong th:text="${enrollment.active} ? 'Active' : 'Inactive'"></strong></div></div><div class="card-footer bg-transparent border-0 pt-0"><a th:href="@{/enrollments/{id}/edit(id=${enrollment.id})}" class="btn btn-primary"><i class="bi bi-pencil me-1"></i>Edit enrollment</a></div></section></main></div></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
