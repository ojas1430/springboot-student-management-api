
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/layout :: head}"></div>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Courses</h2>

                <a th:href="@{/course/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>
                    Add New Course
                </a>
            </div>

            <!-- Success Message -->
            <div th:if="${message != null}"
                 class="alert alert-success text-center"
                 role="alert"
                 th:text="${message}">
            </div>

            <!-- Course List Card -->
            <div class="card mb-4">

                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i>
                    Course List
                </div>

                <div class="card-body">

                    <!-- Empty State -->
                    <div class="text-muted text-center py-3"
                         th:if="${courses == null or courses.content.isEmpty()}">
                        No Courses Found.
                    </div>

                    <!-- Course Table -->
                    <div class="table-responsive"
                         th:if="${courses != null and !courses.content.isEmpty()}">

                        <table class="table table-hover table-striped align-middle">

                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Course Name</th>
                                <th>Course Code</th>
                                <th>Course Fees</th>
                                <th>Duration</th>
                                <th>Actions</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="course : ${courses.content}">

                                <td th:text="${course.id}">1</td>

                                <td th:text="${course.courseName}">
                                    Course Name
                                </td>

                                <td th:text="${course.courseCode}">
                                    CODE
                                </td>

                                <td th:text="${course.fee}">
                                    0.00
                                </td>

                                <td th:text="${course.duration}">
                                    Duration
                                </td>

                                <td>
                                    <a th:href="@{'/course/' + ${course.id}}"
                                       class="btn btn-sm btn-info text-white me-1"
                                       title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>

                                    <a
                                       th:href="@{'/course/' + ${course.id} + '/edit' }" class="btn btn-sm btn-warning text-white me-1"
                                       title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>

                            </tr>
                            </tbody>

                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${courses != null and courses.totalPages > 1}"
                         aria-label="Course pagination">

                        <ul class="pagination justify-content-end">

                            <!-- Previous Page -->
                            <li class="page-item"
                                th:classappend="${courses.first} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${courses.number - 1},size=${courses.size})}">
                                    Previous
                                </a>
                            </li>

                            <!-- Page Numbers -->
                            <li class="page-item"
                                th:each="pageNum : ${#numbers.sequence(0, courses.totalPages - 1)}"
                                th:classappend="${pageNum == courses.number} ? 'active'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${pageNum},size=${courses.size})}"
                                   th:text="${pageNum + 1}">
                                    1
                                </a>
                            </li>

                            <!-- Next Page -->
                            <li class="page-item"
                                th:classappend="${courses.last} ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/course/list(page=${courses.number + 1},size=${courses.size})}">
                                    Next
                                </a>
                            </li>

                        </ul>
                    </nav>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
